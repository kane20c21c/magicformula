# active_strategy.yaml — 5영역 결합 시스템 (M4 분석 확정) ★ 운영 정본
# 작성: 2026-05-30 Kane & 클로이 / v2 정본 승격: 2026-05-31
# ★ 구버전(scorer.py 5영역 가중평균 + R1)은 active_strategy_v1.yaml 로 백업됨.
#   - 구(v1): scorer.py 5영역 가중평균 + composite_score + R1  → active_strategy_v1.yaml
#   - 신(v2): area_scores.compute_combined_score (영역별 레짐 + Wyckoff 게이트)  ← 이 파일
# 데일리/투자포폴 모두 이 파일 하나를 정본으로 참조. system_version 으로 분기.

strategy_id: COMBINED-v3-2026-08
last_updated: '2026-08-25'
source_analysis: StockPortfolio/reports/황금률_전구간_재검증_20260824.html
system_version: v2_combined   # 스키마 버전 (전략 버전 아님) — 데일리 코드 분기용

# ─────────────────────────────────────────────────────
# 종목 점수 — 4영역 가중 결합 + Wyckoff 게이트
# ─────────────────────────────────────────────────────
scoring:
  method: combined_5area     # area_scores.compute_combined_score
  weights:                   # v3 — walk-forward 5/5 fold 일치 + 실측 고원
    trend: 0.0
    momentum: 0.8
    volume: 0.0
    volatility: 0.2
  threshold: 6.0             # 확정 (5.0 후보)
  candidate_threshold: 5.0
  universe: core_excl_split  # 데일리 v2 유니버스

  # 영역별 레짐 판별기 (★ 영역마다 다름)
  regimes:
    trend:                   # breadth
      breadth_lookback: 10
      breadth_horizon: 10
      high_threshold: 0.60
      low_threshold: 0.40
      trend_lookback: 5
    volume_volatility:       # quickregime
      breadth_lookback: 3
      breadth_horizon: 5
      high_threshold: 0.52
      low_threshold: 0.40
      trend_lookback: 5

  # Wyckoff 국면 게이트
  gate:
    enabled: true
    exclude_phases: [Markdown]   # 매수 제외
    source: hillstorm.classify_wyckoff

# ─────────────────────────────────────────────────────
# 영역별 신호 spec (상세는 docs/area_specs/*.md)
# ─────────────────────────────────────────────────────
areas:
  trend:      Dv2(정30/크30/기40) + invert_dist_off_bull   # 가중 0 — 참고값
  momentum:   "(RSI(14) − 50) / 5  — 연속 선형 ±10 (v3)"
  volume:     bear-only Q2+Q3+OBV_contra (강세장 0)        # 가중 0 — 참고값
  volatility: "52주 위치 0.6 + BB %B 꺾임 0.4 — 레짐 미사용 (v3, 리포트 후보 A2)"

# ─────────────────────────────────────────────────────
# v3 변경 내역 (2026-08-25) — 근거 리포트 §5·§6·§14
# ─────────────────────────────────────────────────────
v3_changes:
  변동성:
    이전: BB×52주×레짐 결합 점수표 (52주 저점 버킷에 최고점)
    이후: 52주 위치 0.6 + BB 꺾임 0.4, 레짐 미사용
    근거: 상위 3% 20일 상대수익 −0.89% → +2.41%, 4/4 연도 양수, p<0.001
  모멘텀:
    이전: RSI 5-band 계단 (≥90 에 +10)
    이후: (RSI − 50) / 5 연속 선형
    근거: 계단은 고유값 3개뿐이라 M80 에서 꼭대기 변별 불가. +3.00% → +4.45%
    기울기_민감도: k 3.5~6.0 에서 +4.42~4.48% 로 평탄
  가중치:
    이전: T20/M20/Vu0/Va60
    이후: T0/M80/Vu0/Va20
    근거: M50→M80 단조 개선, M80~M100 평탄. M80 이 MDD 최저·Sharpe 최고
    추세복원시: T0 −18.7% → T10 −22.2% → T20 −29.4% (MDD) 단조 악화
  임계: 6.0 / 5.0 유지 — 실운용 MDD 가 임계에 단조, 6.0 이 누적·Sharpe 최고

  실운용_검증:   # 슬롯10 · t+1 시가 · 왕복 0.43% · 20거래일 · 2023-05~2026-08
    현행_v2: {누적: '+81%', CAGR: '19.5%', MDD: '-29.3%', Sharpe: 0.77}
    v3:      {누적: '+1365%', CAGR: '124.9%', MDD: '-20.4%', Sharpe: 2.41}
    유니버스_균등BH: {누적: '+278%', CAGR: '49.3%', MDD: '-44.8%', Sharpe: 1.40}

  ⚠_한계:
    - "IC 는 여전히 유의하지 않다 (+0.007, p=0.25). 이 점수는 예측 모델이 아니라
       상위 선별기다 — '점수가 높을수록 수익이 좋다' 로 읽으면 안 된다"
    - "유니버스 205종목 현재 명단 — 생존편향. point-in-time 재검증 전 확정 금지"
    - "2023-05~2026-08 은 BM CAGR +45% 초강세장. 약세장 백필 미완"
    - "2026H2 는 v3 도 마이너스(−4.4%). 고모멘텀 계열의 구조적 약점"

# ─────────────────────────────────────────────────────
# 매매 규칙
# ─────────────────────────────────────────────────────
trading:
  entry:
    rule: threshold_breakout    # prev <= thr < today
    fill: next_day_open
    position_size: 10_000_000   # 종목당 1000만원 상한
    one_position_per_ticker: true
  exit:
    stop_loss: "종가 < 진입가 − ATR(14)×1 → 다음날 시가"
    time_stop: "보유 20거래일 + 누적손익 <= 0% → 다음날 시가"
    hold_if_profit: "누적손익 > 0% 면 시간청산 안 함"
    force_exit: "평가종료일 종가"

# ─────────────────────────────────────────────────────
# 백테스트 성능 (2025-06-01 ~ 2026-05-29, in-sample 강세장)
# ─────────────────────────────────────────────────────
performance:
  trades: 73
  avg_return_pct: 85.2
  total_pnl_eok: 6.22
  robust_ex_top5_pct: 51.2
  hit_rate: 54.8
  avg_hold_days: 8
  vs_baseline_pct: "+41pp (베이스라인 평균수익 44.2%)"

caveats:
  - "in-sample only (강세장 1년). out-of-sample 검증 생략 (시장 특수성)"
  - "거래비용/자본제약 미반영. 종목universe 확장으로 robust성 보강 예정"
  - "Vu=0 (거래량 강세장 0). 하락장 길어지면 재평가"

