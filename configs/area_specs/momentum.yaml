# Area 2 — 모멘텀 (Momentum) 영역 spec
# 작성: 2026-05-29 Kane & 클로이 (M4 분석)
# v3 개정: 2026-08-25 — 5-band 계단 → 연속 선형
# 출처: docs/area_specs/momentum.md
#       StockPortfolio/reports/황금률_전구간_재검증_20260824.html §8

area: momentum
status: v3 운영 중 (2026-08-25~)

# ═════════════════════════════════════════════════════
# ★ v3 정본 (2026-08-25~) — area_scores.score_momentum
# ═════════════════════════════════════════════════════
scoring_v3:
  method: rsi_linear
  formula: "(RSI(14) − 50) / 5,  ±10 클립"
  indicator: RSI(14)          # Wilder EWM alpha=1/14
  free_parameters: 없음        # RSI 0~100 을 ±10 에 그대로 얹은 것
  weight_in_combined: 0.8     # T0/M80/Vu0/Va20
  min_rows_required: 35
  coverage: 1.0               # 전 구간 베팅 (구 0.147 에서 확대)

  근거:
    - "계단은 고유값이 0/±5/±10 셋뿐이라 모멘텀 비중 80% 에서 꼭대기 변별이 안 된다"
    - "상위 3% 20일 상대수익 +3.00% → +4.45%, 4/4 연도 양수"
    - "리포트가 권고한 '70~90 최고점 계단 조정'은 실측에서 개선 0
       (+3.00 → +2.94~2.99). 계단을 유지하는 한 어떤 배치도 소용없었다"

  민감도:
    기울기_k: "(RSI−50)/k 에서 k=3.5~6.0 전 구간 +4.42~4.48% 로 평탄.
               k=5 는 자유 파라미터가 아니라 ±10 스케일의 자연스러운 귀결"

  ⚠_한계:
    - "이 축은 20일 상대수익과 순위상관이 없다 (IC +0.001, p=0.86).
       10분위 중 1~7분위가 통째로 뭉개지고 8~10분위에서만 올라간다 —
       **전체 순위를 맞히는 축이 아니라 꼭대기를 고르는 축**이다"
    - "그래서 이 영역에 80% 를 준 것은 '예측력이 높아서'가 아니라
       '상위 선택 성과가 높아서'다. 두 기준이 갈릴 때 황금률은 후자를 쓴다
       (임계 돌파로 소수만 사는 전략이므로)"
    - "리포트 §8 은 RSI≥90 구간 수익을 −2.57%(n=140) 로 적었으나 재계산에서는
       +2.07%(n=169) 로 부호가 반대였다. 전체의 0.1% 라 어느 쪽이든 무의미한 칸"

# ═════════════════════════════════════════════════════
# 구 v2 (~2026-08-25) — score_momentum_step() 으로 보존
# ⚠ 폐기. 롤백 참고용.
# ═════════════════════════════════════════════════════
scoring:
  method: RSI_extreme_trend_only
  status: 폐기 (2026-08-25)
  indicator: RSI(14)
  encoding: 5band_threshold
  boundary: [10, 90]      # 극단 (어중간 30/70 아님 — 경계가 방향 결정)
  direction: trend        # 과매수(RSI>=90) = + (추세 폭발)

  # 5-band 점수 (±10 풀스케일, 추세와 통일)
  bands:
    extreme_high: {cond: "RSI >= 90", score: 10.0}
    mild_high:    {cond: "80 <= RSI < 90", score: 5.0}
    neutral:      {cond: "30 < RSI < 70", score: 0.0}   # 베팅 안 함
    mild_low:     {cond: "20 < RSI <= 30", score: -5.0}
    extreme_low:  {cond: "RSI <= 10", score: -10.0}

  output_range: [-10.0, 10.0]
  coverage: 0.147         # RSI 극단일 때만 베팅
  min_rows_required: 35

# ─────────────────────────────────────────────────────
# 제외 지표
# ─────────────────────────────────────────────────────
excluded:
  stoch_k:
    reason: "모멘텀 내부 결합에서 RSI 대비 도움 안 됨 (레짐 적응해도 -1.2pp)"
    note: "단 레짐 신호로서 0 아님 (하락/전환장 +5~8pp). 5영역 결합 단계 재검토."
  macd:
    reason: "동일 (-2.6pp). RSI 90+ 면 대부분 MACD 양수라 중복."
    note: "MACD ≈ Hist (같은 계산). 레짐 신호로 5영역 결합 단계 재검토."

# ─────────────────────────────────────────────────────
# 검증 성능
# ─────────────────────────────────────────────────────
performance:
  evaluation_window: "2025-05-28 ~ 2026-05-28"
  evaluation_horizon: 3   # 거래일 (모멘텀 = 빠른 신호, h=3 최적)
  bench_pos_ratio: 0.544  # no-signal long-all (h=3)

  rsi_extreme_trend:
    realistic_hit: 0.549
    vs_bench_pp: 0.4
    coverage: 0.147
    betting_hit_rate: 0.573  # 베팅 구간만

  # 비교 (레짐 적응 후)
  stoch_adaptive_vs_bench_pp: -1.2
  macd_adaptive_vs_bench_pp: -2.6

  monthly_stability: "거의 모든 월 0~양수 (강세장 +0.5~1.7, 하락 +1.3)"

# ─────────────────────────────────────────────────────
# 한계
# ─────────────────────────────────────────────────────
caveats:
  - "+0.4pp 작음. coverage 0.147 라 베팅 수 적어 신뢰구간 넓음"
  - "RSI 극단 단조 개선 (0.512→0.573) 은 진짜 신호 특징이나 절대 우위 미미"
  - "h=3 최적. h=5/10 으로 가면 bench 대비 악화"
  - "실제 거래 (entry/exit/cost) 시뮬레이션 미연계"
