# Area 4 — 변동성·위치 (Volatility / Position) 영역 spec
# 작성: 2026-05-30 Kane & 클로이 (M4 분석)
# v3 개정: 2026-08-25 — 점수표 폐기, 52주 위치 + BB 꺾임으로 교체
# 출처: docs/area_specs/volatility.md
#       StockPortfolio/reports/황금률_전구간_재검증_20260824.html §3·§5

area: volatility
status: v3 운영 중 (2026-08-25~). 약세장 검증 미완.

# ═════════════════════════════════════════════════════
# ★ v3 정본 (2026-08-25~) — area_scores.score_volatility
# ═════════════════════════════════════════════════════
scoring_v3:
  method: pos52_plus_bb_kink
  formula: "0.6 × (52주위치 − 0.5) × 20  +  0.4 × BB꺾임점수,  ±10 클립"
  regime: 미사용        # ⚠ v2 와 달리 레짐을 쓰지 않는다
  weight_in_combined: 0.2   # T0/M80/Vu0/Va20

  bb_kink_table:        # BB %B 구간 → 점수. 실측 꺾임 지점에서 도출
    "> 1.0 (밴드 돌파)":  3      # ⚠ 돌파를 눌러야 한다 — 아래 근거 참조
    "0.8 ~ 1.0 (상단)":  10
    "0.6 ~ 0.8":          5
    "0.2 ~ 0.6":          0
    "0.0 ~ 0.2 (하단)":  -3
    "< 0.0 (하단 돌파)":  2

  근거:
    - "v2 점수표는 52주 저점 버킷에 최고점을 줬고, 그 방향이 만든 구간에서도 틀렸다"
    - "교체 후 상위 3% 20일 상대수익 −0.89% → +2.41% (전체 205종목), 4/4 연도 양수, p<0.001"
    - "코어 67종목에서도 −1.29%(0/4) → +4.30%(4/4)"
    - "밴드 돌파를 누르는 이유 — 상위 5% 의 38%가 돌파 종목인데 이들 수익(+1.72%)이
       밴드 상단 구간(+2.03%)보다 낮다. 좁게 고를수록 효과가 커진다"

  민감도:
    52주_대_BB_배분: "0.8:0.2 ~ 0.4:0.6 에서 MDD −18.3~−20.7%, Sharpe 2.21~2.48 로 평탄.
                      0.6:0.4 는 고원 안의 한 점이지 칼날 최적점이 아니다"
    52주_창_길이: "252일. 다만 2년(504일) 창이 IC 는 더 높다 (+0.0245 vs +0.0218, 4/4 vs 3/4)
                   — 교체 후보로 남겨 둠"

  ⚠_한계:
    - "52주 위치는 (종가−저점)/(고점−저점) 이라 분모에 저점이 들어간다. 급락 후
       회복한 종목은 저점이 낮아져 위치가 부풀려진다. 고점 대비 낙폭(Close/52주최고−1)
       이 IC 는 더 높다 (+0.0317, 4/4) — 관측 순위표(B) 후보로 검토 중"
    - "연도별 IC 가 불안정: 2023 +0.006 / 2024 +0.053 / 2025 +0.016 / 2026 −0.005"

# ═════════════════════════════════════════════════════
# 구 v2 (2026-05-31 ~ 2026-08-25) — score_volatility_table() 로 보존
# ⚠ 아래 점수표는 폐기됐다. 롤백 참고용으로만 남긴다.
# ═════════════════════════════════════════════════════
scoring:
  method: joint_bb_52w_regime
  status: 폐기 (2026-08-25)
  philosophy: "BB위치 × 52주위치 × 레짐 3차원 결합. 단독/2차원보다 신호 선명."

  # 버킷 정의
  bb_pctb:
    formula: "(Close - BB_lower) / (BB_upper - BB_lower)"
    buckets:
      돌파상: "> 1.0"
      상단:   "0.8 ~ 1.0"
      중간:   "0.2 ~ 0.8"
      하단:   "0.0 ~ 0.2"
      돌파하: "< 0.0"
  pos_52w:
    formula: "(Close - 52w_low) / (52w_high - 52w_low)"
    window: 252
    buckets:
      고점: ">= 0.8"
      중간: "0.2 ~ 0.8"
      저점: "<= 0.2"

  # 점수표 (BB버킷, 52주버킷) → (강세장점수, 하락조정장점수)
  # 강세장 = quickregime 강세지속/강세약화, 하락조정 = 조정/하락
  # 강세 컬럼은 down베팅 제거 조정 (Kane 2026-05-30 수동)
  score_table:
    돌파상_고점: [5, -5]
    돌파상_중간: [7, -2]
    돌파상_저점: [10, 0]
    상단_고점:   [0, -5]
    상단_중간:   [2, -5]
    상단_저점:   [5, -10]
    중간_고점:   [0, -2]
    중간_중간:   [2, -2]
    중간_저점:   [10, 10]   # 전천후 최강
    하단_고점:   [0, 8]
    하단_중간:   [4, 5]
    하단_저점:   [10, 4]
    돌파하_고점: [8, 10]
    돌파하_중간: [4, 10]    # 강세 단기눌림 매수 / 하락 과매도 반등
    돌파하_저점: [10, 0]

  output_range: [-10.0, 10.0]
  coverage: 0.698           # 비-제로 비율
  min_rows_required: 60

# ─────────────────────────────────────────────────────
# quickregime — 거래량 영역과 공유 (동일 파라미터)
# ─────────────────────────────────────────────────────
quickregime:
  shared_with: volume       # 거래량 영역과 동일 레짐 판별기
  breadth_lookback: 3
  breadth_horizon: 5
  high_threshold: 0.52
  low_threshold: 0.40
  trend_lookback: 5

# ─────────────────────────────────────────────────────
# 검증 성능 (h=5)
# ─────────────────────────────────────────────────────
performance:
  evaluation_window: "2025-05-28 ~ 2026-05-28"
  evaluation_horizon: 5
  bench_pos_ratio: 0.565

  joint:
    realistic_hit: 0.547
    vs_bench_pp: -1.8
    coverage: 0.698

  # 점수 분포
  score_distribution:
    mean: 0.87
    std: 3.17
    nonzero_pct: 69.8
    plus10_pct: 3.0

  # 월별 (강세 조정 후)
  monthly:
    bear_2026_03_vs_bench_pp: 11.2   # 하락장 알파
    bear_2026_05_vs_bench_pp: 7.9
    bull_2026_01_clean_vs_bench_pp: 2.1   # 깨끗한 강세 (오분류 0)
    bull_2025_09_misclass_vs_bench_pp: -10.4   # 레짐 오분류 잔여손실
    bull_2026_04_misclass_vs_bench_pp: -8.7

# ─────────────────────────────────────────────────────
# 핵심 발견
# ─────────────────────────────────────────────────────
findings:
  - "BB 상단돌파 82.7% 가 52주 신고가권 (신고가=추세)"
  - "BB 하단돌파 69.8% 가 52주 레인지내 (일시적 눌림=반등). 빈도 2.18%로 드뭄"
  - "중간+저점 = 전천후 최강 (강세 +19.8 / 하락 +19.1)"
  - "돌파하+중간 = 레짐 반전 (강세 -3 / 하락 +18.2)"
  - "AND 결합이 단독(-2.4)보다 5~8배 강한 신호 (+13~19)"
  - "52주 단독 trend, BB 단독은 무신호. 결합해야 신호."

# ─────────────────────────────────────────────────────
# 한계 / 미해결
# ─────────────────────────────────────────────────────
caveats:
  - "강세장 레짐 오분류 잔여손실 (2025-09/2026-02/04) — quickregime 이 강세장 중 일시 하락일 오분류. 5영역 종합 시 regime 파라미터 통합 조정으로 해결 예정."
  - "in-sample 점수표 (같은 기간 4분면 분석으로 도출). 백테스트 필요."
  - "표본 적은 칸 (저점 계열 n<20) 점수 극단이나 발생 빈도 낮아 실신호 기여 작음."
